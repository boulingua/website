baseURL = "https://boulingua.github.io/website/"
title = "boulingua"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  # The site's own registry key. Every kit script that needs to know which
  # accent, icon and LaTeX colour a repo owns reads this one value rather than
  # inferring it from the directory name — five repos were checked out under a
  # different name than their code at some point.
  code = "hub"
  license = "CC BY-SA 4.0"
  author = "S. Le Boulanger"
  description = "Multilingual Teaching · EFL · FLE · DaF"
  keywords = "language teaching,EFL,FLE,DaF,OER,CEFR,curriculum"
  info = ["Multilingual Teaching Platform", "EFL · FLE · DaF", "Ressources"]
  avatarURL = "images/avatar.png"
  favicon_32 = "images/avatar.png"
  favicon_16 = "images/avatar.png"
  dateFormat = "2006-01-02"
  hideFooter = false
  hideCredits = false
  since = 2025
  colorScheme = "auto"
  # Disable the theme's floating toggle; the navbar #dark-mode-toggle is the single control.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]

[params.plausible]
  # Gate C9 compares this against the data-domain the layout emits. Five repos
  # each grew their own grep for this; the check lives in one place now.
  enable = true
  domain = "boulingua.github.io"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua"

# Top-level nav grouped into three: the products (Platforms), everything
# about the project (About ▾), and the formal pages (Legal ▾).
[[menu.main]]
  name = "Platforms"
  weight = 1
  url = "platforms/"

[[menu.main]]
  identifier = "about"
  name = "About"
  weight = 2
  url = "about/"
[[menu.main]]
  parent = "about"
  name = "Philosophy"
  weight = 1
  url = "philosophy/"
[[menu.main]]
  parent = "about"
  name = "Design & colours"
  weight = 2
  url = "design/"
[[menu.main]]
  parent = "about"
  name = "References"
  weight = 3
  url = "references/"

[[menu.main]]
  identifier = "legal"
  name = "Legal"
  weight = 3
  url = "#"
[[menu.main]]
  parent = "legal"
  name = "Contact"
  weight = 1
  url = "contact/"
[[menu.main]]
  parent = "legal"
  name = "Impressum"
  weight = 2
  url = "impressum/"
[[menu.main]]
  parent = "legal"
  name = "Datenschutz"
  weight = 3
  url = "datenschutz/"
[[menu.main]]
  parent = "legal"
  name = "Haftungsausschluss"
  weight = 4
  url = "haftungsausschluss/"

[module]
  # Import order is load-bearing: hugo-coder supplies the base theme, kit
  # overrides what the platform owns, and this repo's own layouts/ win over
  # both. Reversing the first two makes the theme silently shadow every
  # boulingua shortcode.
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"
  [[module.imports]]
    path = "github.com/boulingua/kit"
